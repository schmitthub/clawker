[features]
hooks = true
multi_agent = true

[agents.test-hunter]
config_file = "../.agents/skills/test-hunter/agents/codex.toml"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.agents/hooks/git-checks.sh"'

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.agents/hooks/go-commands.sh"'
timeout = 5
