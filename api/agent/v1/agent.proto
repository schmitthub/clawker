syntax = "proto3";

package clawker.agent.v1;

option go_package = "github.com/schmitthub/clawker/api/agent/v1";

// AgentService is the inbound gRPC surface clawkerd calls on the CP's
// agent listener on the clawker network. Register is the
// one-time-per-container provenance handshake CP triggers via a
// RegisterRequired Command on the existing CP→clawkerd Session stream.
// ExportTelemetry is the agent telemetry lane: clawkerd relays the agent's OTLP
// batches here and the CP stamps provenance before it forwards them to
// the collector.
//
// Trust model:
//   - The CLI mints the agent's leaf cert at container-create time,
//     signed by the CLI CA. The cert's CN is the canonical
//     clawker.<project>.<agent> identity. The cert carries a URI SAN of
//     the form `urn:clawker:container:<id>` binding it to the docker
//     container_id it was minted for.
//   - clawkerd presents that cert in mTLS when calling Register. CP
//     captures the peer thumbprint (SHA-256 over cert.Raw) at handler
//     entry — the thumbprint is a CAPTURE, not a CLI-pre-staged
//     attestation. CP writes the (thumbprint, container_id) row.
//   - The Register call is gated by a Hydra-issued bearer token the
//     agent obtains by exchanging a single-use CLI-signed
//     client_assertion JWT. Once the assertion is consumed, Register
//     cannot be re-attempted for that container — registration is
//     one-time per container creation.
//
// Transport: mTLS over TCP on the CP's clawker network agent listener.
// Server requires a client cert chained to the CLI CA; authorization
// via Hydra-issued bearer tokens scoped to the `clawker-agent` OAuth2
// client (scope `agent:self:register`).
service AgentService {
  // Register binds (peer cert thumbprint, container_id) into the CP's
  // agentregistry. Container_id is read from the peer cert's URI SAN;
  // the request body carries only the human-readable identity fields
  // for cross-checking against the cert's CN and the docker
  // container's labels.
  //
  // Welcome is empty — success is signaled by the call returning
  // without error. Failure modes return PermissionDenied (cert/CN
  // mismatch, peer-IP mismatch, label mismatch, thumbprint replay) or
  // InvalidArgument (malformed identity fields).
  rpc Register(RegisterRequest) returns (Welcome);

  // ExportTelemetry relays one OTLP batch from the agent's SDK to the collector
  // through the CP. clawkerd's loopback receiver accepts the SDK's
  // http/protobuf POST and forwards the serialized body unchanged; the
  // CP resolves the peer to a registered container, overwrites the
  // identity resource attributes (project, agent, container_id,
  // ingest_source) with the values it resolved itself, and forwards the
  // batch to the collector's agent receiver over the infra mTLS lane.
  //
  // Public scope: no bearer token. The identity interceptor (CN pin,
  // peer IP → labels, SAN compare) plus the registry thumbprint check in
  // the handler are the gate. Failure modes: PermissionDenied (peer not
  // registered or thumbprint mismatch), InvalidArgument (unknown signal,
  // body does not decode), ResourceExhausted (body over the cap),
  // Unavailable (collector forward failed; the relay answers the SDK
  // with a retryable status).
  rpc ExportTelemetry(ExportTelemetryRequest) returns (ExportTelemetryResult);

  // Host actions. clawkerd serves the agent's host-proxy HTTP paths on
  // loopback and relays each request here. The CP is the only path to the
  // host proxy: it resolves the peer to a registered container, applies
  // that container's policy (its labels) and the egress rules, then calls
  // the host proxy over mTLS. Agents cannot reach the host proxy directly.
  //
  // Public scope: no bearer token, same gate as ExportTelemetry, plus the
  // per-container policy. Failure modes: PermissionDenied (identity
  // rejected, host proxy not enabled for this container, action not
  // granted, egress denied, callback session owned by another container),
  // InvalidArgument (malformed request), NotFound (unknown callback
  // session), Unavailable (host proxy unreachable).

  // OpenURL opens a URL in the host browser after the egress check.
  rpc OpenURL(OpenURLRequest) returns (OpenURLResult);

  // GitCredential runs one git credential helper action on the host.
  // Needs the container's HTTPS git credential grant.
  rpc GitCredential(GitCredentialRequest) returns (GitCredentialResult);

  // RegisterCallback is the one-shot OAuth flow: the host proxy checks
  // auth_url against the egress rules, takes the callback port and path
  // from its localhost redirect_uri, binds that port, opens auth_url in
  // the host browser and captures the first callback. The session belongs
  // to the calling container.
  rpc RegisterCallback(RegisterCallbackRequest) returns (RegisterCallbackResult);

  // GetCallbackData polls a callback session the caller owns.
  rpc GetCallbackData(GetCallbackDataRequest) returns (GetCallbackDataResult);

  // DeleteCallback ends a callback session the caller owns.
  rpc DeleteCallback(DeleteCallbackRequest) returns (DeleteCallbackResult);
}

// Signal names which OTLP collector service request the body encodes.
enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_LOGS = 1;
  SIGNAL_METRICS = 2;
  SIGNAL_TRACES = 3;
}

// ExportTelemetryRequest carries one serialized Export<Signal>ServiceRequest, the
// http/protobuf payload exactly as the SDK sent it to the loopback relay.
message ExportTelemetryRequest {
  Signal signal = 1;
  bytes body = 2;
}

// ExportTelemetryResult is the success response. Empty — the act of returning
// without error is the signal; the relay answers the SDK with an empty
// Export<Signal>ServiceResponse.
message ExportTelemetryResult {}

// RegisterRequest carries the human-readable identity claim. The
// agent_name and project are cross-checked against:
//   - the peer cert's canonical CN (clawker.<project>.<agent>)
//   - the docker container's dev.clawker.agent / dev.clawker.project
//     labels (resolved via the container_id read from the cert URI SAN)
//
// container_id is NOT a request field — the handler reads it from the
// cert's URI SAN to defend against a leaked cert being presented for
// the wrong container. The cert's binding to container_id is
// structural, not request-claimed.
message RegisterRequest {
  string agent_name = 1;
  string project = 2;
}

// Welcome is the success response. Empty — the act of returning
// without error is the signal.
message Welcome {}

message OpenURLRequest {
  string url = 1;
}

message OpenURLResult {}

// GitCredentialAction is the git credential helper operation.
enum GitCredentialAction {
  GIT_CREDENTIAL_ACTION_UNSPECIFIED = 0;
  GIT_CREDENTIAL_ACTION_GET = 1;
  GIT_CREDENTIAL_ACTION_STORE = 2;
  GIT_CREDENTIAL_ACTION_ERASE = 3;
}

// GitCredentialRequest carries the git credential protocol fields.
// password is set only for store and erase.
message GitCredentialRequest {
  GitCredentialAction action = 1;
  string protocol = 2;
  string host = 3;
  string path = 4;
  string username = 5;
  string password = 6;
}

// GitCredentialResult carries the credential for get. It is empty for
// store and erase, and for a get that found no credential.
message GitCredentialResult {
  string protocol = 1;
  string host = 2;
  string username = 3;
  string password = 4;
}

// RegisterCallbackRequest carries the authorization URL the agent wants
// to open. Its redirect_uri (or callback) parameter must be
// http://localhost:<port> or http://127.0.0.1:<port>.
message RegisterCallbackRequest {
  string auth_url = 1;
  // ttl_seconds is the session lifetime. Zero selects the default; the
  // host proxy caps it.
  int32 ttl_seconds = 2;
}

message RegisterCallbackResult {
  string session_id = 1;
  // port is the localhost callback port the host proxy bound. The agent
  // forwards the captured callback to this port in the container.
  int32 port = 2;
  int64 expires_at_unix = 3;
}

message GetCallbackDataRequest {
  string session_id = 1;
}

// GetCallbackDataResult reports whether the browser callback arrived and,
// when it did, the captured request.
message GetCallbackDataResult {
  bool received = 1;
  CallbackData callback = 2;
}

// CallbackData is the captured browser callback request.
message CallbackData {
  string method = 1;
  string path = 2;
  string query = 3;
  map<string, string> headers = 4;
  string body = 5;
  int64 received_at_unix = 6;
}

message DeleteCallbackRequest {
  string session_id = 1;
}

message DeleteCallbackResult {}
