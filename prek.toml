# prek hooks — mirrors CI quality gates locally.
# Install: bash scripts/install-hooks.sh
# Run all: prek run --all-files
# Run one: prek run gitleaks --all-files
#
# Scheduling: lower priority runs first; hooks sharing a priority run
# concurrently (capped by PREK_CONCURRENT_HOOKS). go-mod-tidy mutates
# go.mod/go.sum, so it runs alone in the "fix" tier before every scan
# that reads module state (osv-scanner, licenses, tests, lint).
# licenses-check can build the embedded binaries, so it gets its own
# tier after tidy and before the unit-test build and the scans that
# load those binaries.
# The unit-test hook builds embedded binaries, so it must also finish
# before the read-only scans load those binaries.

[priorities]
fix = 0
licenses = 5
build = 7
scan = 10

# ── Security ──────────────────────────────────────────────────────────────

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1

[[repos.hooks]]
id = "gitleaks"
args = ["--baseline-path", "gitleaks-report.json"]
priority = "scan"

# Vulnerability (Go call analysis) and license allowlist gate. Package
# overrides: osv-scanner.toml. CI mirror: security.yml.
[[repos]]
repo = "https://github.com/google/osv-scanner"
rev = "e840a6e8adb14b7777c78e26cfbf6e2abc1d1fc6" # frozen: v2.6.0

[[repos.hooks]]
id = "osv-scanner"
# prek builds the hook; use the installed Go toolchain, never a download.
language_version = "system"
args = ["scan", "source", "--lockfile=go.mod", "--call-analysis=go", "--licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0"]
priority = "scan"

# ── Tidy (mutates go.mod/go.sum — must precede the scan tier) ─────────────

[[repos]]
repo = "https://github.com/tekwizely/pre-commit-golang"
rev = "f298c082154b2cb239fac06a4f452368e66e66dd" # frozen: v1.0.0-rc.4

[[repos.hooks]]
id = "go-mod-tidy"
priority = "fix"

# ── Lint ──────────────────────────────────────────────────────────────────

[[repos]]
repo = "https://github.com/golangci/golangci-lint"
rev = "27774aaf853a4fd21f1dd5e69439459dc1b26e68" # frozen: v2.13.2

[[repos.hooks]]
id = "golangci-lint-full"
# Use the installed linter and Go toolchain.
language = "system"
entry = "golangci-lint run"
args = ["--config", ".golangci.yml"]
priority = "scan"

# ── Local ─────────────────────────────────────────────────────────────────

[[repos]]
repo = "local"

[[repos.hooks]]
id = "semgrep"
name = "Semgrep SAST"
# Expected version: 1.156.0 (must match CI image tag in security.yml)
entry = "semgrep scan --config p/golang --config p/security-audit --error"
language = "system"
types = ["go"]
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "semgrep-actions"
name = "Semgrep GitHub Actions"
# Scans workflow YAML: p/github-actions catches the pull_request_target
# checkout (pwn-request); .semgrep/ adds the pull_request_target cache
# (poisoning) rule. Separate hook so workflow edits are gated even when
# no Go file changes. CI mirror: security.yml.
entry = "semgrep scan --config p/github-actions --config .semgrep/ --error"
language = "system"
files = '^\.github/workflows/.*\.ya?ml$'
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "go-test"
name = "Unit tests"
entry = "make test"
language = "system"
types = ["go"]
pass_filenames = false
priority = "build"

[[repos.hooks]]
id = "docs-check"
name = "Generated docs freshness"
entry = "make docs-check"
language = "system"
files = '^(cmd/|internal/cmd/|internal/docs/|internal/config/([^/]*_)?schema\.go$)'
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "licenses-check"
name = "License generation"
entry = "make licenses-check"
language = "system"
# Embedded license texts derive from module deps AND in-repo LICENSE files
# (vendored code), so trigger on either changing.
files = '^go\.(mod|sum)$|(^|/)(LICENSE[^/]*|NOTICE[^/]*)$|^scripts/licenses\.'
pass_filenames = false
priority = "licenses"

[[repos.hooks]]
id = "agent-compat"
name = "Agent compatibility"
entry = "python3 scripts/check-agent-compatibility.py"
language = "system"
always_run = true
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "plugin-drift"
name = "Plugin Dockerfile template drift check"
shell = "bash"
entry = """
diff internal/bundler/assets/Dockerfile.base.tmpl clawker-plugin/skills/clawker-support/reference/Dockerfile.base.tmpl && \
  diff internal/bundler/assets/Dockerfile.harness-image.tmpl clawker-plugin/skills/clawker-support/reference/Dockerfile.harness-image.tmpl
"""
language = "system"
files = '(internal/bundler/assets/Dockerfile\.(base|harness-image)\.tmpl|^clawker-plugin$)'
pass_filenames = false
priority = "scan"
