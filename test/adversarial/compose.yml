# Docker Compose for Clawker Adversarial Security Tests
#
# The attacker C2 runs on its own network and listens only on host ports.
# Agents reach it through the egress stack (eBPF -> CoreDNS/Envoy -> host),
# for example via the operator's ngrok edge, and only where a rule allows it.
#
# Usage:
#   ./scripts/setup.sh            # One-time: generate TLS certs
#   docker compose up -d          # Start C2
#   docker compose down -v        # Tear down


services:


  # Attacker C2 — serves payloads, captures exfil attempts
  attacker:
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        # Rebuild on Go source or dependency changes
        - action: rebuild
          path: ./attacker-server
        # Rebuild when payloads change
        - action: rebuild
          path: ./payloads
        # Rebuild when Dockerfile changes
        - action: rebuild
          path: ./Dockerfile
    container_name: clawker-test-attacker
    networks:
      - adversarial
    ports:
      - "8443:8443"           # Alternate HTTPS (legacy)
      - "9443:9443"           # Alternate HTTPS (port bypass testing)
      - "8080:8080"           # Plain HTTP (always on, for ngrok)
      - "5454:5353/udp"       # UDP (raw-udp routing test — ngrok UDP edge)
      - "7777:7777"           # Raw TCP echo (opaque tcp_proxy test — ngrok TCP edge)
    cap_add:
      - NET_RAW              # ICMP raw socket listener
    volumes:
      - ./certs:/certs:ro
      - ./payloads:/payloads:ro
    environment:
      - PAYLOADS_DIR=/payloads
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  adversarial:
    name: clawker-adversarial
