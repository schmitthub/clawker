name: Build embedded control plane binaries
description: >
  Builds the `clawkerd`, `clawkercp`, `ebpf-manager`, `coredns-clawker`,
  `bpffs-delegate`, and `idmap-mount`
  Linux binaries via plain CGO_ENABLED=0 Go cross-compiles, and materializes
  the bpf2go-generated Go wrappers at
  `internal/controlplane/firewall/ebpf/clawker_*_bpfel.{go,o}` by running
  `go generate` against the pinned BPF toolchain (clang/llvm/libbpf-dev/
  linux-libc-dev — installed by `make bpf-deps`).

  This is the one-stop prerequisite for any CI job that needs to compile,
  lint, vet, or otherwise analyze the full Go module tree. Embed targets
  hit on a Go build of the whole module:

  - `clawkerd/embed` `go:embed`'s `clawkerd` (per-container daemon)
  - `internal/controlplane/cpboot` `go:embed`'s `clawkercp` + `ebpf-manager`
  - `internal/controlplane/firewall` `go:embed`'s `coredns-clawker`
  - `internal/controlplane/firewall/ebpf/manager.go` references types
    declared in the bpf2go wrappers
  - `controlplane/manager` `go:embed`'s `bpffs-delegate` (elevated bpffs
    delegation one-shot)
  - `internal/cmd/container/shared` `go:embed`'s `idmap-mount` (elevated
    id-mapped-mount one-shot)

  Build order: `clawkerd-binary` MUST come before `cp-binary` because
  `cmd/clawkercp` transitively imports `clawkerd/embed` via
  `internal/docker` → `internal/bundler`, so the `clawkercp` Go build
  refuses to compile until the `//go:embed assets/clawkerd` target exists
  on disk. The Makefile encodes this dependency explicitly on `$(CP_BINARY)`,
  but listing the targets in dependency order here keeps the intent visible
  to a future maintainer.

  Jobs that touch the whole module and skip this step will fail with
  `undefined: clawkerRouteKey` or missing `go:embed` targets.

  Linux-only: the `make bpf-deps` step is gated on `runner.os == 'Linux'`.
  macOS hosts route the bpf2go path through `Dockerfile.controlplane`
  instead (handled by the Makefile, not this action); no CI caller uses
  macOS runners today.

  Ordering rule: call this AFTER `actions/checkout`, and BEFORE any tool
  that does its own working-tree checkout (e.g. `golang/govulncheck-action`
  clobbers whatever's on disk — you can't use it with this). For those
  tools, install and run them manually after this step instead.

  Actions cache: the binaries are restored from the cache when the embed
  inputs did not change. The key hashes `git ls-files -s` of every
  first-party package the six embed commands import (from `go list -deps`),
  plus the Makefile, go.mod, go.sum, Dockerfile.controlplane, the buf files
  and this action. No restore-keys: a stale set must never be restored. A
  pull request run reads the caches of main and saves its own; main.yml
  saves the cache that later pull requests hit. On a hit this action skips
  the BPF toolchain install and the build (about three minutes).

inputs:
  go-version-file:
    description: Path to go.mod for the actions/setup-go go-version-file input.
    required: false
    default: go.mod

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}

    # `go list -e` tolerates the missing go:embed targets; the import graph
    # resolves without them. `git ls-files -s` hashes tracked content only,
    # so untracked build output never changes the key.
    - name: Compute embeds cache key
      id: key
      shell: bash
      run: |
        dirs=$(go list -e -deps -f '{{if not .Standard}}{{.Dir}}{{end}}' \
          ./cmd/clawkerd ./cmd/clawkercp ./controlplane/firewall/ebpf/cmd \
          ./cmd/coredns-clawker ./cmd/bpffs-delegate ./cmd/idmap-mount \
          | grep "^$PWD/" | sed "s|^$PWD/||" | sort -u)
        # shellcheck disable=SC2086 # dirs is a newline list of paths
        hash=$(git ls-files -s -- $dirs Makefile go.mod go.sum Dockerfile.controlplane \
          buf.yaml buf.gen.yaml .github/actions/build-controlplane-binaries | sha256sum | cut -c1-64)
        echo "key=embeds-${{ runner.os }}-${{ runner.arch }}-$hash" | tee -a "$GITHUB_OUTPUT"

    - name: Restore embedded binaries from cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: embedded-binaries.tar
        key: ${{ steps.key.outputs.key }}

    # Install pinned BPF toolchain (clang/llvm/libbpf-dev/linux-libc-dev) so
    # `go generate ./internal/controlplane/firewall/ebpf/...` — invoked by
    # the bpf-bindings prereq below — can drive bpf2go's native compile +
    # llvm-strip path. The pinned versions in the Makefile only resolve on
    # Ubuntu 24.04 (Noble) — callers must use `runs-on: ubuntu-24.04`. macOS
    # dev routes through Dockerfile.controlplane (same ubuntu:24.04 base).
    - name: Install BPF toolchain
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: sudo apt-get update && sudo make bpf-deps

    - name: Build embedded control plane binaries
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: make ebpf-binary coredns-binary clawkerd-binary cp-binary bpffs-delegate-binary idmap-mount-binary

    - name: Pack embedded binaries for the cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: make embeds-tar

    - name: Save embedded binaries to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: embedded-binaries.tar
        key: ${{ steps.key.outputs.key }}

    # Both paths end with the tar on disk; unpack it so the tree is the same
    # after a hit and after a build. --touch makes every member newer than
    # the checkout, so a later `make embeds-tar` re-packs without rebuilding.
    - name: Unpack embedded binaries
      shell: bash
      run: make embeds-untar
