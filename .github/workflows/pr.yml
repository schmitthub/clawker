name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  # Path filters from .github/filters.yml, one output per gated job. A gated
  # job that does not run reports as skipped, which GitHub counts as success
  # for a required status check. The gate must sit on the job inside the
  # reusable workflow (the run_* input), never on the caller job or the
  # workflow trigger, or the required check never reports and the PR hangs
  # on "Expected". If this job fails, its outputs are empty and every
  # `!= 'false'` test below runs the job. An edit to the filters file or to
  # this workflow runs every gated job (the `ci` filter), so a wrong rule is
  # exercised before it merges.
  #
  # Stacked pull requests: the heavy jobs (unit, lint, docs, licenses, bpf,
  # osv-scanner, and so the embeds build) run in full on two layers and are
  # forced off on the rest. The top layer: the path filter only sees that
  # layer's files, and merging the top lands every lower layer, so the top
  # PR must be tested with all of it. The lowest unmerged layer (its base
  # is the stack base): it is the next PR to land on main when the stack is
  # merged one layer at a time, and after each merge the next layer is
  # rebased onto main and becomes it. main.yml also runs the full suite
  # on every push to main; a release is only cut from a tag. Cheap jobs
  # (dependency review, plugin drift, semgrep, gitleaks, agent-compat) keep
  # their own rules. The stack object is logged because the webhook docs
  # only list it on the `stacked` action.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 2
    outputs:
      osv_scanner: ${{ steps.gate.outputs.osv_scanner }}
      dependency_review: ${{ steps.filter.outputs.dependency_review }}
      lint: ${{ steps.gate.outputs.lint }}
      unit: ${{ steps.gate.outputs.unit }}
      bpf: ${{ steps.gate.outputs.bpf }}
      licenses: ${{ steps.gate.outputs.licenses }}
      docs: ${{ steps.gate.outputs.docs }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      # Checkout only to read the filters file; changed files come from the
      # pull request API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yml
          # Default `some` compiles each `!glob` as a picomatch negation that
          # matches every other path, so exclusions would match everything.
          predicate-quantifier: some-with-excludes

      - name: Apply stack gate
        id: gate
        env:
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          BASE: ${{ github.event.pull_request.base.ref }}
          F_OSV: ${{ steps.filter.outputs.osv_scanner }}
          F_LINT: ${{ steps.filter.outputs.lint }}
          F_UNIT: ${{ steps.filter.outputs.unit }}
          F_BPF: ${{ steps.filter.outputs.bpf }}
          F_LICENSES: ${{ steps.filter.outputs.licenses }}
          F_DOCS: ${{ steps.filter.outputs.docs }}
        run: |
          echo "stack=$STACK"
          # none: not in a stack, use the path filter. full: the top layer
          # or the lowest unmerged layer, force on. below: force off.
          pos=$(jq -nr --argjson s "$STACK" --arg base "$BASE" \
            'if $s == null then "none" elif $s.position == $s.size or $s.base.ref == $base then "full" else "below" end')
          echo "stack_position=$pos"
          gate() {
            case "$pos" in
              full) echo "$1=true" ;;
              below) echo "$1=false" ;;
              *) echo "$1=$2" ;;
            esac
          }
          {
            gate osv_scanner "$F_OSV"
            gate lint "$F_LINT"
            gate unit "$F_UNIT"
            gate bpf "$F_BPF"
            gate licenses "$F_LICENSES"
            gate docs "$F_DOCS"
          } | tee -a "$GITHUB_OUTPUT"

  # Builds the go:embed binaries and bpf2go bindings once per run and shares
  # them as an artifact; every job below that needs them restores from it.
  # The action restores them from the Actions cache when the embed inputs
  # did not change; main.yml saves the cache on its first miss.
  build:
    name: Embedded binaries
    needs: changes
    if: >-
      ${{ !cancelled() && (
        needs.changes.outputs.osv_scanner != 'false' ||
        needs.changes.outputs.lint != 'false' ||
        needs.changes.outputs.unit != 'false' ||
        needs.changes.outputs.licenses != 'false' ||
        needs.changes.outputs.docs != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build embedded control plane binaries
        uses: ./.github/actions/build-controlplane-binaries

      # One tar keeps the executable bits; the artifact store drops them.
      - name: Pack embedded binaries
        run: make embeds-tar

      - name: Upload embedded binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-binaries
          path: embedded-binaries.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  security:
    name: Security
    needs: [changes, build]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write # Dependency Review posts a PR comment on failure
      security-events: write
      actions: read
    with:
      run_dependency_review: ${{ needs.changes.outputs.dependency_review != 'false' }}
      run_osv_scanner: ${{ needs.changes.outputs.osv_scanner != 'false' }}

  lint:
    name: Lint
    needs: [changes, build]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      actions: read
    with:
      run_golangci_lint: ${{ needs.changes.outputs.lint != 'false' }}

  test:
    name: Test
    needs: [changes, build]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    with:
      run_unit: ${{ needs.changes.outputs.unit != 'false' }}
      run_bpf: ${{ needs.changes.outputs.bpf != 'false' }}

  licenses:
    name: Licenses
    needs: [changes, build]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/licenses.yml
    permissions:
      contents: read
    with:
      run_licenses: ${{ needs.changes.outputs.licenses != 'false' }}

  docs:
    name: Docs
    needs: [changes, build]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
    with:
      run_docs: ${{ needs.changes.outputs.docs != 'false' }}

  plugin:
    name: Plugin
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/plugin.yml
    permissions:
      contents: read
    with:
      run_dockerfile_drift: ${{ needs.changes.outputs.plugin != 'false' }}
