name: Test

on:
  workflow_call:
    inputs:
      run_unit:
        required: false
        type: boolean
        default: true
      run_bpf:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    if: inputs.run_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore embedded binaries
        uses: ./.github/actions/restore-embedded-binaries

      - name: Run unit tests
        run: make test-ci

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  root:
    # Socket server root tests: the server runs as root in the container and
    # chowns what it creates to the agent. The test sets up as root for a
    # distinct uid and checks access as that uid; the unit job runs as the
    # runner user, where it skips.
    name: Root Tests
    if: inputs.run_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run root tests
        run: make test-root

  bpf:
    # Privileged BPF prog-run suite (cilium bpf/tests pattern): SYSCALL
    # wrapper programs #including the production common.h run under
    # BPF_PROG_TEST_RUN against real kernel maps. Needs CAP_BPF — the test
    # binary runs under sudo via `make test-bpf` — and the pinned BPF apt
    # toolchain, which only resolves on ubuntu-24.04.
    name: BPF Prog-Run Tests
    if: inputs.run_bpf
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: sudo apt-get update && sudo make bpf-deps

      - name: Run privileged BPF prog-run tests
        run: make test-bpf
