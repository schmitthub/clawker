# Path filters for dorny/paths-filter, read by the "changes" jobs in pr.yml
# and codeql.yml. Each key is one output; a job in a reusable workflow, or a
# CodeQL language, runs when its key is true. Globs use picomatch with dot files matched; '!' excludes.
#
# `go` is every file a Go build, test, or scan reads: sources, go:embed
# assets, testdata, BPF C, proto. It is scoped by directory, not by
# extension, because go:embed inputs have any extension (.md, .tmpl, .sh,
# .sql, .o) and must live under the embedding package, so a directory match
# is the exact rule. Agent instruction and license files never feed a build.
#
# `ci` and `codeql_ci` are the gating wiring itself. An edit to it must run
# every gated job, or a wrong rule merges without ever running the checks it
# controls.

ci: &ci
  - '.github/filters.yml'
  - '.github/workflows/pr.yml'

codeql_ci: &codeql_ci
  - '.github/filters.yml'
  - '.github/workflows/codeql.yml'

# `go_paths` is positive-only so a filter can reuse it with its own
# exclusions. With some-with-excludes an exclusion is final: no later
# include can match a file it rejected.
go_paths: &go_paths
  - 'cmd/**'
  - 'internal/**'
  - 'pkg/**'
  - 'controlplane/**'
  - 'clawkerd/**'
  - 'test/**'
  - 'api/**'
  - 'go.mod'
  - 'go.sum'
  - 'buf.yaml'
  - 'buf.gen.yaml'
  - 'Makefile'
  - 'Dockerfile.controlplane'
  - '.github/actions/**'

go: &go
  - *go_paths
  - '!**/AGENTS.md'
  - '!**/CLAUDE.md'
  - '!**/LICENSE*'
  - '!**/NOTICE*'

osv_scanner:
  - *ci
  - *go
  - '.github/workflows/security.yml'
  - 'osv-scanner.toml'
  - 'prek.toml'

dependency_review:
  - *ci
  - '**/go.mod'
  - '**/go.sum'
  - '.github/workflows/**'
  - '.github/dependency-review-config.yml'

lint:
  - *ci
  - *go
  - '.golangci.yml'
  - '.github/workflows/lint.yml'

unit:
  - *ci
  - *go
  - '.github/workflows/test.yml'

bpf:
  - *ci
  - 'controlplane/firewall/ebpf/**'
  - 'go.mod'
  - 'go.sum'
  - 'Makefile'
  - 'Dockerfile.controlplane'
  - '.github/workflows/test.yml'

# go-licenses walks the import graph, so Go sources are inputs too. Built
# from go_paths, not go, because go excludes LICENSE and NOTICE files.
licenses:
  - *ci
  - *go_paths
  - '!**/AGENTS.md'
  - '!**/CLAUDE.md'
  - '**/LICENSE*'
  - '**/NOTICE*'
  - 'scripts/licenses.*'
  # Release platforms and hooks; scripts/licenses.sh mirrors the list.
  - '.goreleaser.yaml'
  - '.github/workflows/licenses.yml'

docs:
  - *ci
  - *go
  - 'docs/**'
  - '.github/workflows/docs.yml'

plugin:
  - *ci
  - 'internal/bundler/assets/**'
  - 'clawker-plugin'
  - '.gitmodules'
  - '.github/workflows/plugin.yml'

# CodeQL, one key per language in codeql.yml. `codeql_go` reuses `go`, which
# already names every Go build input.
codeql_actions:
  - *codeql_ci
  - '.github/workflows/**'
  - '.github/actions/**'

codeql_c_cpp:
  - *codeql_ci
  - '**/*.c'
  - '**/*.h'

codeql_go:
  - *codeql_ci
  - *go

codeql_python:
  - *codeql_ci
  - '**/*.py'

# The JavaScript analysis is scoped to .claude/hooks (see codeql.yml), but
# any new JavaScript file elsewhere must still run it so the scope gets
# widened before the file merges unanalyzed.
codeql_js:
  - *codeql_ci
  - '**/*.js'
  - '**/*.mjs'
  - '**/*.cjs'
  - '**/*.ts'
  - '**/*.tsx'
  - '.claude/hooks/**'
